<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SongSpot IL - זהה את השיר</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --success: #22c55e;
      --error: #ef4444;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    body {
      margin: 0;
      padding: 20px;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .container {
      width: 100%;
      max-width: 520px;
      background: var(--card);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      text-align: center;
      position: relative;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 28px;
      color: var(--accent);
    }
    .subtitle {
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 16px;
    }

    /* בורר רמות קושי */
    .difficulty-bar {
      display: flex;
      gap: 6px;
      justify-content: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .diff-btn {
      background: #0f172a;
      color: var(--text-muted);
      border: 1px solid #334155;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .diff-btn:hover {
      border-color: var(--accent);
      color: var(--text);
    }
    .diff-btn.active {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
    }

    .attempts-track {
      display: flex;
      gap: 6px;
      justify-content: center;
      margin-bottom: 20px;
    }
    .attempt-box {
      flex: 1;
      height: 36px;
      background: #334155;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: bold;
    }
    .attempt-box.active {
      border: 2px solid var(--accent);
    }
    .attempt-box.wrong {
      background: var(--error);
    }
    .attempt-box.correct {
      background: var(--success);
    }

    .player-controls {
      margin: 20px 0;
    }
    .play-btn {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 14px 28px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: opacity 0.2s;
    }
    .play-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* אזור חיפוש והשלמה אוטומטית */
    .input-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 15px;
      position: relative;
    }
    .search-wrapper {
      position: relative;
      width: 100%;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: var(--text);
      font-size: 16px;
      text-align: right;
    }
    input:focus {
      outline: none;
      border-color: var(--accent);
    }
    .suggestions-list {
      position: absolute;
      top: 100%;
      right: 0;
      left: 0;
      background: #0f172a;
      border: 1px solid #475569;
      border-top: none;
      border-radius: 0 0 8px 8px;
      max-height: 220px;
      overflow-y: auto;
      z-index: 50;
      display: none;
      box-shadow: 0 8px 16px rgba(0,0,0,0.6);
    }
    .suggestion-item {
      padding: 10px 14px;
      text-align: right;
      cursor: pointer;
      border-bottom: 1px solid #1e293b;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
    }
    .suggestion-item:hover {
      background: #1e293b;
      color: var(--accent);
    }
    .suggestion-artist {
      color: var(--text-muted);
      font-size: 12px;
    }

    .actions-row {
      display: flex;
      gap: 8px;
    }
    .btn-submit {
      flex: 2;
      padding: 12px;
      border-radius: 8px;
      border: none;
      background: #38bdf8;
      color: #000;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-skip {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      background: transparent;
      border: 1px solid #475569;
      color: var(--text);
      font-weight: bold;
      cursor: pointer;
    }
    .btn-submit:disabled, .btn-skip:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .result-card {
      margin-top: 20px;
      padding: 16px;
      border-radius: 12px;
      background: #0f172a;
      display: none;
    }
    .result-card img {
      width: 110px;
      height: 110px;
      border-radius: 8px;
      margin-top: 10px;
    }
    .next-btn {
      background: var(--success);
      color: #fff;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: bold;
      margin-top: 15px;
      cursor: pointer;
      display: none;
      width: 100%;
      font-size: 16px;
    }
    .streams-badge {
      display: inline-block;
      background: #334155;
      color: #cbd5e1;
      font-size: 12px;
      padding: 3px 10px;
      border-radius: 99px;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>SongSpot IL 🎵</h1>
    <div class="subtitle" id="status-label">בחר רמת קושי והתחל לשחק</div>

    <!-- בחירת רמת קושי -->
    <div class="difficulty-bar" id="difficulty-bar">
      <button class="diff-btn active" data-level="easy">קל (להיטי ענק)</button>
      <button class="diff-btn" data-level="medium">בינוני</button>
      <button class="diff-btn" data-level="hard">קשה</button>
      <button class="diff-btn" data-level="very_hard">קשה מאוד</button>
      <button class="diff-btn" data-level="impossible">בלתי אפשרי</button>
    </div>

    <div class="streams-badge" id="streams-badge">כמות השמעות משוערת: 20M+</div>

    <div class="attempts-track" id="attempts-track">
      <div class="attempt-box active">0.2ש'</div>
      <div class="attempt-box">0.5ש'</div>
      <div class="attempt-box">1.0ש'</div>
      <div class="attempt-box">2.0ש'</div>
      <div class="attempt-box">3.5ש'</div>
      <div class="attempt-box">5.0ש'</div>
    </div>

    <div class="player-controls">
      <button class="play-btn" id="play-btn" disabled>
        ▶ השמע קטע (<span id="play-time-label">0.2</span> שניות)
      </button>
    </div>

    <div class="input-section">
      <div class="search-wrapper">
        <input type="text" id="guess-input" placeholder="הקלד שם שיר או אמן..." disabled autocomplete="off" />
        <div class="suggestions-list" id="suggestions-list"></div>
      </div>
      <div class="actions-row">
        <button class="btn-submit" id="submit-btn" disabled>נחש</button>
        <button class="btn-skip" id="skip-btn" disabled>דלג (+זמן)</button>
      </div>
    </div>

    <div class="result-card" id="result-card">
      <div id="result-text" style="font-weight: bold; margin-bottom: 6px; font-size: 18px;"></div>
      <div id="song-details" style="color: var(--text-muted); font-size: 15px;"></div>
      <img id="song-cover" src="" alt="Album Cover" />
    </div>

    <button class="next-btn" id="next-btn">לשיר הבא ⏭</button>
  </div>

  <script>
    // מאגר שירים מחולק ל-5 רמות קושי לפי פופולריות ומספר השמעות
    const SONG_DB = {
      easy: {
        streamsText: "כמות השמעות משוערת: 15M - 50M+ (להיטי מדינה)",
        songs: [
          { artist: "חנן בן ארי", title: "אלוף העולם" },
          { artist: "אושר כהן", title: "אהבה" },
          { artist: "פאר טסי", title: "אהבה חולה" },
          { artist: "נועה קירל", title: "יוניקורן" },
          { artist: "עדן חסון", title: "שקיעות אדומות" },
          { artist: "עומר אדם", title: "שני משוגעים" },
          { artist: "אייל גולן", title: "צליל מיתר" },
          { artist: "טונה", title: "סהרה" },
          { artist: "יסמין מועלם", title: "מסיבה" },
          { artist: "סטטיק ובן אל", title: "סלסולים" },
          { artist: "עידן רייכל", title: "שבט אחים ואחיות" },
          { artist: "ישי ריבו", title: "הלב שלי" }
        ]
      },
      medium: {
        streamsText: "כמות השמעות משוערת: 5M - 15M (מוכרים מאוד)",
        songs: [
          { artist: "רביד פלוטניק", title: "כל הזמן הזה" },
          { artist: "נתן גושן", title: "באתי לחלום" },
          { artist: "אמיר דדון", title: "אור גדול" },
          { artist: "משינה", title: "רכבת לילה" },
          { artist: "שלמה ארצי", title: "תתארו לכם" },
          { artist: "אודיה", title: "אינטלקטוערסית" },
          { artist: "בניה ברבי", title: "קרן שמש" },
          { artist: "מרגי", title: "סגול בהיר" },
          { artist: "איתי לוי", title: "קירות" },
          { artist: "מוניקה סקס", title: "מכה אפורה" },
          { artist: "אביב גפן", title: "אור הירח" }
        ]
      },
      hard: {
        streamsText: "כמות השמעות משוערת: 1M - 5M (לחובבי מוזיקה)",
        songs: [
          { artist: "פול טראנק", title: "סתלבט בקיבוץ" },
          { artist: "התקווה 6", title: "הכי ישראלי" },
          { artist: "אביתר בנאי", title: "עד מחר" },
          { artist: "ברי סחרוף", title: "ניצוצות" },
          { artist: "הדג נחש", title: "שירת הסטיקר" },
          { artist: "סינרגיה", title: "תראי זה אני" },
          { artist: "בית הבובות", title: "סיגפו" },
          { artist: "גיא ויהל", title: "רצים באוויר" },
          { artist: "אליעד", title: "מסע" },
          { artist: "שחר טבוך", title: "מישבאלי" }
        ]
      },
      very_hard: {
        streamsText: "כמות השמעות משוערת: 300K - 1M (קלאסיקות ושירי אלבום)",
        songs: [
          { artist: "מרסדס בנד", title: "תגידי לי את" },
          { artist: "איפה הילד", title: "מה שעובר עלי" },
          { artist: "ג'ירפות", title: "גג" },
          { artist: "אלג'יר", title: "קיטש" },
          { artist: "היהודים", title: "קח אותי" },
          { artist: "כוורת", title: "המגפיים של ברוך" },
          { artist: "תיסלם", title: "רדיו חזק" },
          { artist: "כנסיית השכל", title: "למיה יש אקדח" },
          { artist: "אסף אמדורסקי", title: "יקירתי" }
        ]
      },
      impossible: {
        streamsText: "כמות השמעות משוערת: מתחת ל-300K (אינדי ובי-סיידס)",
        songs: [
          { artist: "הילה רוח", title: "דובה גריזלית" },
          { artist: "גון בן ארי", title: "אבק" },
          { artist: "טדי נגוסה", title: "זה בדם שלי" },
          { artist: "שלומי שבן", title: "אריק" },
          { artist: "קרולינה", title: "אף אחד לא בא לי" },
          { artist: "הבילויים", title: "אוטו זבל" },
          { artist: "נושאי המגבעת", title: "הבא בתור הוא סוס" },
          { artist: "רם אוריון", title: "קר" },
          { artist: "תמוז", title: "סוף עונת התפוזים" }
        ]
      }
    };

    // איחוד כל השירים למאגר חיפוש מקומי מהיר
    const ALL_LOCAL_SONGS = Object.values(SONG_DB).flatMap(level => level.songs);

    const DURATIONS = [0.2, 0.5, 1.0, 2.0, 3.5, 5.0];
    let currentDifficulty = "easy";
    let currentAttempt = 0;
    let currentSong = null;
    let audio = new Audio();
    let stopTimeout = null;
    let searchDebounce = null;

    // רכיבי DOM
    const playBtn = document.getElementById("play-btn");
    const playTimeLabel = document.getElementById("play-time-label");
    const guessInput = document.getElementById("guess-input");
    const suggestionsList = document.getElementById("suggestions-list");
    const submitBtn = document.getElementById("submit-btn");
    const skipBtn = document.getElementById("skip-btn");
    const statusLabel = document.getElementById("status-label");
    const streamsBadge = document.getElementById("streams-badge");
    const resultCard = document.getElementById("result-card");
    const resultText = document.getElementById("result-text");
    const songDetails = document.getElementById("song-details");
    const songCover = document.getElementById("song-cover");
    const nextBtn = document.getElementById("next-btn");
    const boxes = document.querySelectorAll(".attempt-box");
    const diffButtons = document.querySelectorAll(".diff-btn");

    // מעבר בין רמות קושי
    diffButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        diffButtons.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentDifficulty = btn.dataset.level;
        streamsBadge.textContent = SONG_DB[currentDifficulty].streamsText;
        fetchRandomSong();
      });
    });

    // שליפת שיר מרמת הקושי הנבחרת
    async function fetchRandomSong() {
      resetUI();
      statusLabel.textContent = "טוען שיר מרמת הקושי שנבחרה...";

      const pool = SONG_DB[currentDifficulty].songs;
      const item = pool[Math.floor(Math.random() * pool.length)];
      const query = encodeURIComponent(`${item.artist} ${item.title}`);
      const itunesUrl = `https://itunes.apple.com/search?country=IL&media=music&entity=song&limit=1&term=${query}`;

      try {
        const response = await fetch(itunesUrl);
        const data = await response.json();

        if (data.results && data.results.length > 0) {
          const track = data.results[0];
          currentSong = {
            title: item.title, // שומרים על השם העברי הנקי שהגדרנו
            itunesTitle: track.trackName,
            artist: item.artist,
            previewUrl: track.previewUrl,
            artwork: track.artworkUrl100.replace("100x100bb", "300x300bb")
          };

          audio.src = currentSong.previewUrl;
          audio.preload = "auto";

          statusLabel.textContent = "האזן לקטע ונחש את השיר!";
          playBtn.disabled = false;
          guessInput.disabled = false;
          submitBtn.disabled = false;
          skipBtn.disabled = false;
        } else {
          fetchRandomSong();
        }
      } catch (err) {
        statusLabel.textContent = "שגיאה בטעינת השיר. בדוק חיבור אינטרנט.";
      }
    }

    // השלמה אוטומטית (Autocomplete) בזמן הקלדה
    guessInput.addEventListener("input", () => {
      const val = guessInput.value.trim();
      clearTimeout(searchDebounce);

      if (val.length < 1) {
        suggestionsList.style.display = "none";
        return;
      }

      // 1. סינון מיידי מהמאגר המקומי לפי האותיות שהוקלדו
      const normalizedVal = normalizeHebrew(val);
      const localMatches = ALL_LOCAL_SONGS.filter(s =>
        normalizeHebrew(s.title).includes(normalizedVal) ||
        normalizeHebrew(s.artist).includes(normalizedVal)
      );

      renderSuggestions(localMatches);

      // 2. שליפת השלמות נוספות מ-iTunes API עבור חיפושים חופשיים
      if (val.length >= 2) {
        searchDebounce = setTimeout(async () => {
          try {
            const url = `https://itunes.apple.com/search?country=IL&media=music&entity=song&limit=6&term=${encodeURIComponent(val)}`;
            const res = await fetch(url);
            const data = await res.json();
            if (data.results) {
              const apiSongs = data.results.map(r => ({
                artist: r.artistName,
                title: r.trackName
              }));
              // מיזוג ללא כפילויות
              const combined = [...localMatches];
              apiSongs.forEach(apiSong => {
                const exists = combined.some(c =>
                  normalizeHebrew(c.title) === normalizeHebrew(apiSong.title)
                );
                if (!exists) combined.push(apiSong);
              });
              renderSuggestions(combined.slice(0, 8));
            }
          } catch (e) {}
        }, 250);
      }
    });

    function renderSuggestions(items) {
      suggestionsList.innerHTML = "";
      if (items.length === 0) {
        suggestionsList.style.display = "none";
        return;
      }

      items.forEach(item => {
        const div = document.createElement("div");
        div.className = "suggestion-item";
        div.innerHTML = `
          <span><strong>${item.title}</strong></span>
          <span class="suggestion-artist">${item.artist}</span>
        `;
        div.addEventListener("click", () => {
          guessInput.value = `${item.title} - ${item.artist}`;
          guessInput.dataset.selectedTitle = item.title;
          suggestionsList.style.display = "none";
        });
        suggestionsList.appendChild(div);
      });

      suggestionsList.style.display = "block";
    }

    // סגירת הרשימה בלחיצה מחוץ לתיבה
    document.addEventListener("click", (e) => {
      if (!e.target.closest(".search-wrapper")) {
        suggestionsList.style.display = "none";
      }
    });

    // השמעת קטע
    function playSnippet() {
      clearTimeout(stopTimeout);
      audio.pause();
      audio.currentTime = 0;

      const duration = DURATIONS[currentAttempt];
      audio.play().then(() => {
        playBtn.textContent = "🔊 מנגן...";
        playBtn.disabled = true;

        stopTimeout = setTimeout(() => {
          audio.pause();
          audio.currentTime = 0;
          playBtn.disabled = false;
          updatePlayButtonText();
        }, duration * 1000);
      }).catch(() => {
        playBtn.disabled = false;
      });
    }

    function normalizeHebrew(text) {
      return text
        .replace(/[\u0591-\u05C7]/g, "")
        .replace(/[.,\/#!$%\^&\*;:{}=\-_`~()?"']/g, "")
        .replace(/\s+/g, " ")
        .trim()
        .toLowerCase();
    }

    function handleGuess() {
      const rawValue = guessInput.dataset.selectedTitle || guessInput.value.split("-")[0];
      const userGuess = normalizeHebrew(rawValue);
      if (!userGuess) return;

      suggestionsList.style.display = "none";
      const targetTitle = normalizeHebrew(currentSong.title);
      const itunesTitle = normalizeHebrew(currentSong.itunesTitle || "");

      const isCorrect =
        targetTitle.includes(userGuess) ||
        userGuess.includes(targetTitle) ||
        (itunesTitle && itunesTitle.includes(userGuess));

      if (isCorrect) {
        endRound(true);
      } else {
        advanceAttempt();
      }
    }

    function advanceAttempt() {
      suggestionsList.style.display = "none";
      boxes[currentAttempt].classList.remove("active");
      boxes[currentAttempt].classList.add("wrong");
      currentAttempt++;
      guessInput.value = "";
      delete guessInput.dataset.selectedTitle;

      if (currentAttempt < DURATIONS.length) {
        boxes[currentAttempt].classList.add("active");
        updatePlayButtonText();
      } else {
        endRound(false);
      }
    }

    function updatePlayButtonText() {
      playBtn.innerHTML = `▶ השמע קטע (<span id="play-time-label">${DURATIONS[currentAttempt]}</span> שניות)`;
    }

    function endRound(won) {
      audio.pause();
      clearTimeout(stopTimeout);
      suggestionsList.style.display = "none";

      if (won) {
        boxes[currentAttempt].classList.remove("active");
        boxes[currentAttempt].classList.add("correct");
        resultText.textContent = "בול! זיהית נכון 🎉";
        resultText.style.color = "var(--success)";
      } else {
        resultText.textContent = "לא הצלחת הפעם... 😔";
        resultText.style.color = "var(--error)";
      }

      songDetails.textContent = `${currentSong.artist} - ${currentSong.title}`;
      songCover.src = currentSong.artwork;
      resultCard.style.display = "block";
      nextBtn.style.display = "block";

      guessInput.disabled = true;
      submitBtn.disabled = true;
      skipBtn.disabled = true;
      playBtn.disabled = true;
    }

    function resetUI() {
      currentAttempt = 0;
      audio.pause();
      clearTimeout(stopTimeout);
      guessInput.value = "";
      delete guessInput.dataset.selectedTitle;
      suggestionsList.style.display = "none";
      guessInput.disabled = true;
      submitBtn.disabled = true;
      skipBtn.disabled = true;
      playBtn.disabled = true;
      resultCard.style.display = "none";
      nextBtn.style.display = "none";

      boxes.forEach((box, i) => {
        box.className = "attempt-box";
        if (i === 0) box.classList.add("active");
      });
      updatePlayButtonText();
    }

    playBtn.addEventListener("click", playSnippet);
    submitBtn.addEventListener("click", handleGuess);
    skipBtn.addEventListener("click", advanceAttempt);
    guessInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") handleGuess();
    });
    nextBtn.addEventListener("click", fetchRandomSong);

    // הפעלה ראשונית
    fetchRandomSong();
  </script>
