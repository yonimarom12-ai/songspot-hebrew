<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SongSpot עברי</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --success: #22c55e;
      --error: #ef4444;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    body {
      margin: 0;
      padding: 20px;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .container {
      width: 100%;
      max-width: 480px;
      background: var(--card);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      text-align: center;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 26px;
      color: var(--accent);
    }
    .subtitle {
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 20px;
    }
    .attempts-track {
      display: flex;
      gap: 6px;
      justify-content: center;
      margin-bottom: 24px;
    }
    .attempt-box {
      flex: 1;
      height: 36px;
      background: #334155;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: bold;
    }
    .attempt-box.active {
      border: 2px solid var(--accent);
    }
    .attempt-box.wrong {
      background: var(--error);
    }
    .attempt-box.correct {
      background: var(--success);
    }
    .player-controls {
      margin: 20px 0;
    }
    .play-btn {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 14px 28px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: opacity 0.2s;
    }
    .play-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .input-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 15px;
    }
    input {
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: var(--text);
      font-size: 16px;
      text-align: right;
    }
    input:focus {
      outline: none;
      border-color: var(--accent);
    }
    .btn-submit {
      padding: 12px;
      border-radius: 8px;
      border: none;
      background: #475569;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
    }
    .result-card {
      margin-top: 20px;
      padding: 16px;
      border-radius: 12px;
      background: #0f172a;
      display: none;
    }
    .result-card img {
      width: 100px;
      height: 100px;
      border-radius: 8px;
      margin-top: 10px;
    }
    .next-btn {
      background: var(--success);
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: bold;
      margin-top: 15px;
      cursor: pointer;
      display: none;
      width: 100%;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>SongSpot IL 🎵</h1>
    <div class="subtitle" id="status-label">טוען שיר...</div>

    <div class="attempts-track" id="attempts-track">
      <div class="attempt-box active">0.2ש'</div>
      <div class="attempt-box">0.5ש'</div>
      <div class="attempt-box">1.0ש'</div>
      <div class="attempt-box">2.0ש'</div>
      <div class="attempt-box">3.5ש'</div>
      <div class="attempt-box">5.0ש'</div>
    </div>

    <div class="player-controls">
      <button class="play-btn" id="play-btn" disabled>
        ▶ השמע קטע (<span id="play-time-label">0.2</span> שניות)
      </button>
    </div>

    <div class="input-section" id="input-section">
      <input type="text" id="guess-input" placeholder="שם השיר או האמן..." disabled autocomplete="off" />
      <button class="btn-submit" id="submit-btn" disabled>נחש</button>
      <button class="btn-submit" id="skip-btn" style="background: transparent; border: 1px solid #475569;" disabled>דלג</button>
    </div>

    <div class="result-card" id="result-card">
      <div id="result-text" style="font-weight: bold; margin-bottom: 8px;"></div>
      <div id="song-details" style="color: var(--text-muted); font-size: 14px;"></div>
      <img id="song-cover" src="" alt="Album Cover" />
    </div>

    <button class="next-btn" id="next-btn">לשיר הבא ⏭</button>
  </div>

  <script>
    // מאגר שירים ראשוני לחיפוש בחנות הישראלית
    const PLAYLIST = [
      { artist: "חנן בן ארי", title: "אלוף העולם" },
      { artist: "אושר כהן", title: "אהבה" },
      { artist: "פאר טסי", title: "אהבה חולה" },
      { artist: "נועה קירל", title: "יוניקורן" },
      { artist: "עדן חסון", title: "אין יותר מועדונים" },
      { artist: "אייל גולן", title: "צליל מיתר" },
      { artist: "טונה", title: "סהרה" },
      { artist: "יסמין מועלם", title: "מסיבה" }
    ];

    const DURATIONS = [0.2, 0.5, 1.0, 2.0, 3.5, 5.0];
    let currentAttempt = 0;
    let currentSong = null;
    let audio = new Audio();
    let stopTimeout = null;

    // רכיבי DOM
    const playBtn = document.getElementById("play-btn");
    const playTimeLabel = document.getElementById("play-time-label");
    const guessInput = document.getElementById("guess-input");
    const submitBtn = document.getElementById("submit-btn");
    const skipBtn = document.getElementById("skip-btn");
    const statusLabel = document.getElementById("status-label");
    const resultCard = document.getElementById("result-card");
    const resultText = document.getElementById("result-text");
    const songDetails = document.getElementById("song-details");
    const songCover = document.getElementById("song-cover");
    const nextBtn = document.getElementById("next-btn");
    const boxes = document.querySelectorAll(".attempt-box");

    // שליפת שיר מחנות אפל בישראל (ללא API Key)
    async function fetchRandomSong() {
      resetUI();
      statusLabel.textContent = "טוען שיר ישראלי...";
      
      const item = PLAYLIST[Math.floor(Math.random() * PLAYLIST.length)];
      const query = encodeURIComponent(`${item.artist} ${item.title}`);
      const itunesUrl = `https://itunes.apple.com/search?country=IL&media=music&entity=song&limit=1&term=${query}`;

      try {
        const response = await fetch(itunesUrl);
        const data = await response.json();

        if (data.results && data.results.length > 0) {
          const track = data.results[0];
          currentSong = {
            title: track.trackName,
            artist: track.artistName,
            previewUrl: track.previewUrl,
            artwork: track.artworkUrl100.replace("100x100bb", "300x300bb")
          };

          audio.src = currentSong.previewUrl;
          audio.preload = "auto";

          statusLabel.textContent = "נחש את השיר לפי הצליל!";
          playBtn.disabled = false;
          guessInput.disabled = false;
          submitBtn.disabled = false;
          skipBtn.disabled = false;
        } else {
          fetchRandomSong(); // נסה שיר אחר במקרה שאין תוצאה
        }
      } catch (err) {
        statusLabel.textContent = "שגיאה בחיבור לשירות המוזיקה. נסה לרענן.";
      }
    }

    // השמעת קטע מדויק
    function playSnippet() {
      clearTimeout(stopTimeout);
      audio.pause();
      audio.currentTime = 0;

      const duration = DURATIONS[currentAttempt];
      audio.play().then(() => {
        playBtn.textContent = "🔊 מנגן...";
        playBtn.disabled = true;

        stopTimeout = setTimeout(() => {
          audio.pause();
          audio.currentTime = 0;
          playBtn.disabled = false;
          updatePlayButtonText();
        }, duration * 1000);
      }).catch(() => {
        playBtn.disabled = false;
      });
    }

    // ניקוי ונרמול מחרוזות בעברית להשוואה
    function normalizeHebrew(text) {
      return text
        .replace(/[\u0591-\u05C7]/g, "") // הסרת ניקוד
        .replace(/[.,\/#!$%\^&\*;:{}=\-_`~()?"']/g, "") // הסרת פיסוק
        .replace(/\s+/g, " ")
        .trim()
        .toLowerCase();
    }

    function handleGuess() {
      const userGuess = normalizeHebrew(guessInput.value);
      if (!userGuess) return;

      const normalizedTitle = normalizeHebrew(currentSong.title);
      const isCorrect = normalizedTitle.includes(userGuess) || userGuess.includes(normalizedTitle);

      if (isCorrect) {
        endRound(true);
      } else {
        advanceAttempt();
      }
    }

    function advanceAttempt() {
      boxes[currentAttempt].classList.remove("active");
      boxes[currentAttempt].classList.add("wrong");
      currentAttempt++;
      guessInput.value = "";

      if (currentAttempt < DURATIONS.length) {
        boxes[currentAttempt].classList.add("active");
        updatePlayButtonText();
      } else {
        endRound(false);
      }
    }

    function updatePlayButtonText() {
      playTimeLabel.textContent = DURATIONS[currentAttempt];
      playBtn.innerHTML = `▶ השמע קטע (<span id="play-time-label">${DURATIONS[currentAttempt]}</span> שניות)`;
    }

    function endRound(won) {
      audio.pause();
      clearTimeout(stopTimeout);

      if (won) {
        boxes[currentAttempt].classList.remove("active");
        boxes[currentAttempt].classList.add("correct");
        resultText.textContent = "בול! זיהית נכון 🎉";
        resultText.style.color = "var(--success)";
      } else {
        resultText.textContent = "לא הצלחת הפעם... 😔";
        resultText.style.color = "var(--error)";
      }

      songDetails.textContent = `${currentSong.artist} - ${currentSong.title}`;
      songCover.src = currentSong.artwork;
      resultCard.style.display = "block";
      nextBtn.style.display = "block";

      // ניטרול כפתורי קלט
      guessInput.disabled = true;
      submitBtn.disabled = true;
      skipBtn.disabled = true;
      playBtn.disabled = true;
    }

    function resetUI() {
      currentAttempt = 0;
      audio.pause();
      clearTimeout(stopTimeout);
      guessInput.value = "";
      guessInput.disabled = true;
      submitBtn.disabled = true;
      skipBtn.disabled = true;
      playBtn.disabled = true;
      resultCard.style.display = "none";
      nextBtn.style.display = "none";

      boxes.forEach((box, i) => {
        box.className = "attempt-box";
        if (i === 0) box.classList.add("active");
      });
      updatePlayButtonText();
    }

    // אירועים
    playBtn.addEventListener("click", playSnippet);
    submitBtn.addEventListener("click", handleGuess);
    skipBtn.addEventListener("click", advanceAttempt);
    guessInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") handleGuess();
    });
    nextBtn.addEventListener("click", fetchRandomSong);

    // התחלת המשחק עם טעינת הדף
    fetchRandomSong();
  </script>
</body>
</html>
